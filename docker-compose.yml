# Имя проекта задано явно: из имени папки «Расписание 2.0» Compose
# не может получить допустимое имя (только латиница, цифры, «-», «_»).
name: raspisanie

# Настройки — в файле .env рядом (образец: .env.example). Без него работают значения по умолчанию.

# Автоподнятие (README, «Надёжность»): упавший контейнер Docker перезапускает сам (restart),
# зависший — перезапускает себя проверкой здоровья (stand/healthcheck.py, нужен init: true);
# после перезагрузки сервера всё поднимается вместе со службой Docker.
x-logging: &logging              # логи не забивают диск: до 3 файлов по 10 МБ на контейнер
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-health: &health                # 3 неудачи подряд (~1,5 мин) — контейнер перезапускается
  interval: 30s
  timeout: 15s
  retries: 3
  start_period: 60s

x-stand: &stand
  build:
    context: .
    dockerfile: stand/Dockerfile
  image: raspisanie-stand
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/app/data
  restart: unless-stopped
  init: true
  logging: *logging

services:
  parser:
    build:
      context: ./vendor/smart_schedule_parser
      dockerfile: docker/Dockerfile
    # как в апстрим-compose: сервер должен слушать все интерфейсы контейнера
    command: bash -c "sed -i 's/HOST=.*/HOST=0.0.0.0/' /app/.env && /app/parser_server"
    restart: unless-stopped
    init: true
    mem_limit: 1g
    logging: *logging

  # единственный писатель schedule.db: сбор по расписанию и по запросу из версии руководства
  collector:
    <<: *stand
    command: ["python", "collector.py", "run"]
    mem_limit: 1g
    healthcheck:
      <<: *health
      test: ["CMD", "python", "healthcheck.py", "file", "/tmp/collector.alive", "2400"]
    depends_on:
      - parser

  # сайт для студентов и преподавателей
  public:
    <<: *stand
    # --limit-concurrency: сверх 64 одновременных запросов на процесс — сразу 503, а не очередь до зависания
    command: ["uvicorn", "public.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2",
              "--limit-concurrency", "64", "--timeout-keep-alive", "5",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    mem_limit: 768m
    healthcheck:
      <<: *health
      test: ["CMD", "python", "healthcheck.py", "url", "http://localhost:8000/healthz"]
    depends_on:
      - collector

  # версия для руководства (Streamlit) по адресу /rukovodstvo
  staff:
    <<: *stand
    mem_limit: 1g
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "python healthcheck.py url \"http://localhost:8501/$${STAFF_BASE_PATH:-rukovodstvo}/_stcore/health\""]
    depends_on:
      - collector

  # единая точка входа: /  → public, /rukovodstvo → staff
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    mem_limit: 128m
    logging: *logging
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -q -T 10 -O /dev/null http://127.0.0.1/nginx-health || (kill 1; exit 1)"]
    depends_on:
      - public
      - staff
    restart: unless-stopped
