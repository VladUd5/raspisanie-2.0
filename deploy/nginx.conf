# Единая точка входа: студентам — /, руководству — /rukovodstvo.
# Этот же файл годится как образец для nginx вуза: замените адреса public:8000 и staff:8501 на свои
# и уберите resolver (он нужен только внутри Docker).
# Адреса контейнеров берутся у DNS Docker при каждом запросе (через переменные): после
# пересоздания public/staff nginx не держит старые IP и не отдаёт 502.
resolver 127.0.0.11 valid=10s ipv6=off;

# не больше 10 сообщений об ошибках в минуту с одного адреса (сверх лимита приложения)
limit_req_zone $binary_remote_addr zone=report:1m rate=10r/m;
# Защита от наплыва: страница — это 1–4 запроса, обычному посетителю хватает с большим запасом;
# скрипт, долбящий сайт, получает 429 и не мешает остальным. Если перед этим nginx стоит прокси вуза,
# все приходят с одного адреса — тогда включите set_real_ip_from/real_ip_header (модуль realip).
limit_req_zone $binary_remote_addr zone=site:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    set $public_site http://public:8000;
    set $staff_site http://staff:8501;
    server_name _;
    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript application/json text/calendar;
    limit_conn conn 60;

    # пока public или staff перезапускается — понятная страница вместо голой 502
    error_page 502 503 504 =503 /restarting.html;
    location = /restarting.html {
        internal;
        default_type text/html;
        charset utf-8;
        add_header Retry-After 60 always;
        return 503 '<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="refresh" content="30"><title>Расписание перезапускается</title><body style="font:16px/1.5 system-ui,sans-serif;max-width:520px;margin:15vh auto;padding:0 16px;color:#15201A"><h1 style="font-size:24px">Сайт перезапускается</h1><p>Обычно это занимает меньше минуты. Страница обновится сама.</p></body></html>';
    }
    error_page 429 /busy.html;
    location = /busy.html {
        internal;
        default_type text/html;
        charset utf-8;
        add_header Retry-After 10 always;
        return 429 '<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Слишком много запросов</title><body style="font:16px/1.5 system-ui,sans-serif;max-width:520px;margin:15vh auto;padding:0 16px;color:#15201A"><h1 style="font-size:24px">Слишком много запросов</h1><p>С вашего адреса пришло слишком много запросов подряд. Подождите несколько секунд и обновите страницу.</p></body></html>';
    }
    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok"; }

    absolute_redirect off;                     # относительные переадресации: порт и схема сохраняются
    location = /rukovodstvo { return 301 /rukovodstvo/; }
    location /rukovodstvo/ {
        proxy_pass $staff_site;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # Streamlit работает через WebSocket
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;          # с портом: ссылки подписки на календарь
        proxy_read_timeout 86400;
    }

    location = /report {
        limit_req zone=report burst=5 nodelay;
        proxy_pass $public_site;
        proxy_set_header Host $http_host;          # с портом: ссылки подписки на календарь
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass $public_site;
        expires 1d;
    }

    location / {
        limit_req zone=site burst=100 nodelay;
        proxy_read_timeout 30s;                    # страница считается за доли секунды; дольше — что-то не так
        proxy_pass $public_site;
        proxy_set_header Host $http_host;          # с портом: ссылки подписки на календарь
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
