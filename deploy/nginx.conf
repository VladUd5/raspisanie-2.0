# Единая точка входа: студентам — /, руководству — /rukovodstvo.
# Этот же файл годится как образец для nginx вуза: замените адреса public:8000 и staff:8501 на свои
# и уберите resolver (он нужен только внутри Docker).
# Адреса контейнеров берутся у DNS Docker при каждом запросе (через переменные): после
# пересоздания public/staff nginx не держит старые IP и не отдаёт 502.
resolver 127.0.0.11 valid=10s ipv6=off;

# не больше 10 сообщений об ошибках в минуту с одного адреса (сверх лимита приложения)
limit_req_zone $binary_remote_addr zone=report:1m rate=10r/m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    set $public_site http://public:8000;
    set $staff_site http://staff:8501;
    server_name _;
    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript application/json text/calendar;

    location = /rukovodstvo { return 301 /rukovodstvo/; }
    location /rukovodstvo/ {
        proxy_pass $staff_site;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # Streamlit работает через WebSocket
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;          # с портом: ссылки подписки на календарь
        proxy_read_timeout 86400;
    }

    location = /report {
        limit_req zone=report burst=5 nodelay;
        proxy_pass $public_site;
        proxy_set_header Host $http_host;          # с портом: ссылки подписки на календарь
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass $public_site;
        expires 1d;
    }

    location / {
        proxy_pass $public_site;
        proxy_set_header Host $http_host;          # с портом: ссылки подписки на календарь
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
